<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Probar API Rest</title>
    <link rel="icon" href="data:," />
    <style>
      article {
        border: 1px solid #ccc;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      img {
        height: auto;
        width: 320px;
        max-width: 100%;
      }

      .error {
        color: #b42318;
        font-weight: 600;
      }
    </style>
    <script type="module">
      const API_BASES = ["/api", "/.netlify/functions/api"];

      const fetchFromApi = async (path, options = {}) => {
        for (const base of API_BASES) {
          const response = await fetch(`${base}${path}`, options);

          if (response.ok) {
            return response;
          }

          if (response.status !== 404) {
            throw new Error(`Request failed with status ${response.status}`);
          }
        }

        throw new Error("Movies API route is not available.");
      };

      const renderError = (message) => {
        document.querySelector("main").innerHTML =
          `<p class="error">${message}</p>`;
      };

      fetchFromApi("/movies")
        .then((res) => res.json())
        .then((movies) => {
          const html = movies
            .map((movie) => {
              return `
            <article data-id="${movie.id}">
              <h2>${movie.title}</h2>
              <img src="${movie.poster}" alt="${movie.title}">
              <p>${movie.year}</p>

              <button>eliminar</button>
            </article>
          `;
            })
            .join("");

          document.querySelector("main").innerHTML = html;

          document.addEventListener("click", async (e) => {
            if (e.target.matches("button")) {
              const article = e.target.closest("article");
              const id = article.dataset.id;

              try {
                await fetchFromApi(`/movies/${id}`, {
                  method: "DELETE",
                });
                article.remove();
              } catch {
                renderError("No se pudo eliminar la película.");
              }
            }
          });
        })
        .catch(() => {
          renderError("No se pudo cargar la lista de películas.");
        });
    </script>
  </head>
  <body>
    <main></main>
  </body>
</html>
