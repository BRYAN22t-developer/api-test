<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Probar API Rest</title>
    <link rel="icon" href="data:," />
    <style>
      article {
        border: 1px solid #ccc;
        padding: 1rem;
        margin-bottom: 1rem;
      }

      img {
        height: auto;
        width: 320px;
        max-width: 100%;
      }

      .error {
        color: #b42318;
        font-weight: 600;
      }
    </style>
    <script type="module">
      const API_BASES = ["/api", "/.netlify/functions/api"];

      async function fetchFromApi(path, options = {}) {
        for (const base of API_BASES) {
          const response = await fetch(`${base}${path}`, options);

          if (response.ok) {
            return response;
          }

          if (response.status !== 404) {
            throw new Error(`Request failed with status ${response.status}`);
          }
        }

        throw new Error("Movies API route is not available.");
      }

      function renderError(message) {
        const main = document.querySelector("main");
        main.textContent = "";

        const paragraph = document.createElement("p");
        paragraph.className = "error";
        paragraph.textContent = message;
        main.append(paragraph);
      }

      function createMovieArticle(movie) {
        const article = document.createElement("article");
        article.dataset.id = movie.id;

        const title = document.createElement("h2");
        title.textContent = movie.title;

        const image = document.createElement("img");
        image.src = movie.poster;
        image.alt = movie.title;

        const year = document.createElement("p");
        year.textContent = String(movie.year);

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "eliminar";

        article.append(title, image, year, button);
        return article;
      }

      function renderMovies(movies) {
        const main = document.querySelector("main");
        main.textContent = "";

        for (const movie of movies) {
          main.append(createMovieArticle(movie));
        }
      }

      async function loadMovies() {
        try {
          const response = await fetchFromApi("/movies");
          const contentType = response.headers.get("content-type") ?? "";

          if (!contentType.includes("application/json")) {
            throw new Error("Unexpected non-JSON response");
          }

          const movies = await response.json();
          renderMovies(movies);
        } catch {
          renderError("No se pudo cargar la lista de películas.");
        }
      }

      document.addEventListener("click", async (e) => {
        if (!(e.target instanceof HTMLButtonElement)) {
          return;
        }

        const article = e.target.closest("article");
        const id = article?.dataset.id;

        if (!id || !article) {
          return;
        }

        try {
          await fetchFromApi(`/movies/${id}`, {
            method: "DELETE",
          });
          article.remove();
        } catch {
          renderError("No se pudo eliminar la película.");
        }
      });

      loadMovies();
    </script>
  </head>
  <body>
    <main></main>
  </body>
</html>
